[meta]
source = "Espressif ESP32-S3-DevKitC-1 v1.1 user guide"
revision = "v1.1"

[headers.J1]
pins = [
  "3V3", "3V3", "RST", "GPIO4", "GPIO5", "GPIO6", "GPIO7", "GPIO15",
  "GPIO16", "GPIO17", "GPIO18", "GPIO8", "GPIO3", "GPIO46", "GPIO9",
  "GPIO10", "GPIO11", "GPIO12", "GPIO13", "GPIO14", "5V", "GND"
]

[headers.J3]
pins = [
  "GND", "GPIO43_TX", "GPIO44_RX", "GPIO1", "GPIO2", "GPIO42", "GPIO41",
  "GPIO40", "GPIO39", "GPIO38", "GPIO37", "GPIO36", "GPIO35", "GPIO0",
  "GPIO45", "GPIO48", "GPIO47", "GPIO21", "GPIO20_USB_DP", "GPIO19_USB_DM",
  "GND", "GND"
]

[constraints]
strapping = ["GPIO0", "GPIO3", "GPIO45", "GPIO46"]
native_usb = ["GPIO19_USB_DM", "GPIO20_USB_DP"]
revision_sensitive = ["GPIO38", "GPIO48"]
variant_sensitive = ["GPIO35", "GPIO36", "GPIO37"]

[notes]
rgb_led = "v1.1 uses GPIO38; initial board revision used GPIO48"
variant_sensitive = "GPIO35/36/37 are not available externally on variants using octal flash/PSRAM combinations that consume these pins"
