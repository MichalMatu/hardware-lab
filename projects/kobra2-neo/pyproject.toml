[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kobra-plot"
version = "0.1.0"
description = "Offline preparation pipeline for the Anycubic Kobra 2 Neo pen plotter"
requires-python = ">=3.11,<3.14"
dependencies = [
  "vpype==1.15.0",
]

[project.scripts]
kobra-plot = "kobra_plot:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools]
py-modules = ["kobra_plot"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
